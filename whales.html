<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEGEN FM — Live Whale Alerts</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#02070d;
  color:#dffcff;
  font-family:monospace;
  padding:80px 18px 40px;
}
.top{
  position:fixed;top:0;left:0;width:100%;
  background:#030b12;border-bottom:2px solid #00f7ff;
  display:flex;align-items:center;z-index:10;
}
.live{
  background:#00f7ff;color:#001014;
  padding:16px 22px;font-weight:bold;
}
.ticker{
  white-space:nowrap;overflow:hidden;color:#00ff88;
  padding-left:20px;font-size:14px;
}
h1{
  color:#00f7ff;
  font-size:34px;
  margin:25px 0 10px;
  text-shadow:0 0 18px #00f7ff88;
}
.sub{color:#7fa6b8;margin-bottom:30px}
.panel{
  border:1px solid #00f7ff55;
  background:linear-gradient(180deg,#071525,#03080e);
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 28px #00f7ff22;
}
.row{
  border:1px solid #ffee0055;
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
  display:grid;
  grid-template-columns:50px 1fr auto;
  gap:14px;
  align-items:center;
  background:#06111d;
}
.icon{font-size:28px}
.symbol{font-size:24px;font-weight:bold;color:#fff}
.meta{color:#7fa6b8;margin-top:6px}
.buy{color:#00ff88}
.sell{color:#ff3b6b}
.badge{
  border:1px solid #00f7ff;
  color:#00f7ff;
  padding:6px 10px;
  border-radius:8px;
}
.footer{
  color:#5f7f8d;
  margin-top:24px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="top">
  <div class="live">⚡ LIVE</div>
  <div class="ticker" id="ticker">Loading real DexScreener market feed...</div>
</div>

<h1>🐋 WHALE ALERTS & LIVE FEED</h1>
<div class="sub">Real market data via DexScreener public feed · auto updates every 30s</div>

<div class="panel" id="feed">
  Loading live whale-style alerts...
</div>

<div class="footer">
  DEGEN FM is a media and analytics demo. Not financial advice.
</div>

<script>
const tokens = ["SOL", "WIF", "BONK", "PEPE", "DOGE", "SHIB", "POPCAT"];

async function loadWhales(){
  const feed = document.getElementById("feed");
  const ticker = document.getElementById("ticker");

  try{
    let all = [];

    for(const q of tokens){
      const res = await fetch("https://api.dexscreener.com/latest/dex/search?q=" + q);
      const data = await res.json();

      if(data.pairs && data.pairs.length){
        const p = data.pairs
          .filter(x => x.chainId === "solana" || x.chainId === "ethereum" || x.chainId === "bsc")
          .sort((a,b)=>(b.volume?.h24||0)-(a.volume?.h24||0))[0];

        if(p) all.push(p);
      }
    }

    all = all
      .filter(Boolean)
      .sort((a,b)=>(b.volume?.h24||0)-(a.volume?.h24||0))
      .slice(0,8);

    let html = "";
    let tick = "";

    all.forEach(p=>{
      const symbol = p.baseToken?.symbol || "UNKNOWN";
      const vol = Math.round(p.volume?.h24 || 0).toLocaleString();
      const liq = Math.round(p.liquidity?.usd || 0).toLocaleString();
      const change = Number(p.priceChange?.h24 || 0);
      const side = change >= 0 ? "BUY" : "SELL";
      const cls = change >= 0 ? "buy" : "sell";
      const icon = change >= 0 ? "▲" : "▼";
      const label = (p.volume?.h24 || 0) > 1000000 ? "Whale" : "Smart Wallet";

      html += `
      <div class="row">
        <div class="icon ${cls}">${icon}</div>
        <div>
          <div class="symbol">${symbol}</div>
          <div class="meta">
            $${vol} VOL · ${side} pressure · ${change.toFixed(2)}% 24h<br>
            Liquidity: $${liq} · ${p.dexId || "DEX"}
          </div>
        </div>
        <div class="badge">${label}</div>
      </div>`;

      tick += `🐋 ${symbol} ${side} pressure ${change.toFixed(2)}% · VOL $${vol} /// `;
    });

    feed.innerHTML = html || "No live data found.";
    ticker.innerText = tick || "Waiting for live market data...";

  }catch(e){
    feed.innerHTML = "API loading error. Refresh in a minute.";
    ticker.innerText = "DexScreener feed temporarily unavailable.";
  }
}

loadWhales();
setInterval(loadWhales,30000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEGEN FM RADIO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020617;
font-family:'Orbitron',sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#00f7ff22,transparent 30%),
radial-gradient(circle at bottom right,#ff00aa22,transparent 30%);
z-index:-1;
}

.player{
width:90%;
max-width:550px;
background:rgba(0,10,30,0.85);
border:1px solid rgba(0,255,255,0.25);
border-radius:25px;
padding:40px;
text-align:center;
box-shadow:0 0 40px rgba(0,255,255,0.2);
backdrop-filter:blur(10px);
}

.logo{
font-size:55px;
font-weight:900;
background:linear-gradient(90deg,#00f7ff,#ff00aa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

.live{
color:#00ff88;
margin-bottom:25px;
font-size:18px;
letter-spacing:3px;
}

.status{
margin-top:20px;
color:#00f7ff;
font-size:14px;
}

audio{
width:100%;
margin-top:30px;
filter:drop-shadow(0 0 15px #00f7ff88);
}

.equalizer{
display:flex;
justify-content:center;
gap:6px;
margin-top:30px;
height:40px;
}

.bar{
width:8px;
background:#00f7ff;
border-radius:10px;
animation:bounce 1s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:0.2s;}
.bar:nth-child(3){animation-delay:0.4s;}
.bar:nth-child(4){animation-delay:0.6s;}
.bar:nth-child(5){animation-delay:0.8s;}

@keyframes bounce{
0%,100%{height:10px;}
50%{height:40px;}
}

.footer{
margin-top:30px;
font-size:12px;
color:#889;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="player">

<div class="logo">DEGEN FM</div>

<div class="live">● LIVE CYBER RADIO</div>

<p>24/7 Synthwave Crypto Broadcast</p>

<div class="equalizer">
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>

<audio controls autoplay>
<source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg">
</audio>

<div class="status">
DegenBot-24 Broadcasting Live...
</div>

<div class="footer">
DEGEN FM © 2026
</div>

</div>

</body>
</html>

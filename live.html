<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEGEN FM LIVE</title>

<style>
body{
background:#050816;
color:#00f7ff;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.player{
width:90%;
max-width:500px;
background:#081020;
border:1px solid #00f7ff;
border-radius:20px;
padding:30px;

}

h1{
font-size:40px;
margin-bottom:20px;
text-shadow:0 0 20px #00f7ff;
}

.live{
color:#ff0088;
margin-bottom:20px;
}

audio{
width:100%;
margin-top:20px;
}

.status{
margin-top:20px;
color:#00ff88;
font-size:18px;
}
</style>
</head>

<body>

<div class="player">

<h1>DEGEN FM</h1>

<div class="live">● LIVE RADIO</div>

<p>Cyberpunk synthwave crypto radio stream</p>

<audio controls autoplay>
<source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg">
</audio>

<div class="status">
DegenBot-24 Broadcasting...
</div>

</div>

</html>

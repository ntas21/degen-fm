<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEGEN FM LIVE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#02040a;
color:white;
font-family:'Orbitron',sans-serif;
overflow-x:hidden;
background-image:
linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
background-size:40px 40px;
}

.topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:50px;
background:black;
border-bottom:2px solid #00f7ff;
display:flex;
align-items:center;
overflow:hidden;
z-index:999;
}

.live{
background:#4ffcff;
color:black;
padding:14px 24px;
font-weight:bold;
}

.ticker{
white-space:nowrap;
display:inline-block;
padding-left:100%;
animation:ticker 25s linear infinite;
font-size:14px;
color:#00ff90;
}

@keyframes ticker{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

.container{
padding-top:100px;
width:90%;
max-width:1300px;
margin:auto;
}

.logo{
text-align:center;
margin-top:80px;
}

.logo h1{
font-size:90px;
background:linear-gradient(90deg,#4ffcff,#ff4fd8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 25px rgba(0,255,255,0.5);
}

.logo p{
margin-top:20px;
color:#8defff;
letter-spacing:3px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:80px;
}

.card{
background:rgba(0,10,30,0.85);
border:1px solid rgba(0,255,255,0.25);
padding:30px;
border-radius:18px;
box-shadow:0 0 20px rgba(0,255,255,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 25px rgba(0,255,255,0.3);
}

.token{
font-size:30px;
margin-bottom:20px;
}

.price{
font-size:32px;
color:#4ffcff;
margin-bottom:10px;
}

.change{
font-size:18px;
}

.green{
color:#00ff90;
}

.red{
color:#ff4d6d;
}

.footer{
text-align:center;
padding:80px 20px;
color:#557;
font-size:12px;
}

</style>
</head>

<body>

<div class="topbar">
<div class="live">⚡ LIVE</div>

<div class="ticker" id="ticker">
Loading live market data...
</div>
</div>

<div class="container">

<div class="logo">
<h1>DEGEN FM</h1>
<p>LIVE CRYPTO INTELLIGENCE TERMINAL</p>
</div>

<div class="stats" id="marketData">

</div>

<div class="footer">
DEGEN FM © 2026 — LIVE MARKET FEED ACTIVE
</div>

</div>

<script>

async function loadPrices(){

const url =
'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,dogecoin,pepe,bonk,cat-in-a-dogs-world&vs_currencies=usd&include_24hr_change=true';

const res = await fetch(url);

const data = await res.json();

const coins = [
['bitcoin','BTC'],
['ethereum','ETH'],
['solana','SOL'],
['dogecoin','DOGE'],
['pepe','PEPE'],
['bonk','BONK'],
['cat-in-a-dogs-world','MEW']
];

let html='';

let ticker='';

coins.forEach(c=>{

const coin=data[c[0]];

const change=coin.usd_24h_change.toFixed(2);

const color=change >=0 ? 'green':'red';

html+=`
<div class="card">

<div class="token">${c[1]}</div>

<div class="price">$${coin.usd}</div>

<div class="change ${color}">
${change}%
</div>

</div>
`;

ticker += `${c[1]} ${coin.usd} USD (${change}%) /// `;
});

document.getElementById('marketData').innerHTML=html;

document.getElementById('ticker').innerHTML=ticker;

}

loadPrices();

setInterval(loadPrices,30000);

</script>

</body>
</html>
